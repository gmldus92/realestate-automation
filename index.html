<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부동산 리포트 — 2026-11-28</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
           background: #f5f6fa; color: #2d3436; font-size: 14px; }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #636e72; font-size: 12px; margin-bottom: 20px; }

    .section-title {
      font-size: 13px; font-weight: 700; color: #636e72;
      text-transform: uppercase; letter-spacing: .5px;
      margin: 24px 0 10px;
    }

    /* 실거래가 표 */
    .trade-table { width: 100%; border-collapse: collapse;
                   background: #fff; border-radius: 12px; overflow: hidden;
                   box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 10px; }
    .trade-table th { background: #6c5ce7; color: #fff; font-size: 12px;
                      padding: 10px 12px; text-align: left; font-weight: 600; }
    .trade-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
    .trade-table tr:last-child td { border-bottom: none; }
    .trade-table tr:hover td { background: #f8f8ff; }
    .price-cell { font-weight: 700; color: #e17055; }

    /* 그래프 */
    .chart-wrap { background:#fff; border-radius:12px; padding:12px;
                  margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); }

    a { color: #3498db; text-decoration: none; }
    footer { text-align:center; font-size:11px; color:#b2bec3; margin-top:24px; padding-bottom:20px; }
  </style>
</head>
<body>
<div class="container">
  <h1>🏠 부동산 리포트</h1>
  <p class="subtitle">2026-11-28 기준 자동 생성</p>

  <!-- 단지별 최근 실거래가 5개씩 -->

</div>

</html>
